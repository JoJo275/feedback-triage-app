# Runs React frontend quality gates (lint, typecheck, unit test, build)
# and a Playwright smoke pass against built assets.
# ci-gate required — do not add paths-ignore (see ci-gate.yml).

name: Web Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web (${{ matrix.check }})    # ci-gate: required

    if: >-
      ${{
        github.repository == 'OWNER/REPO'
        || vars.ENABLE_WORKFLOWS == 'true'
        || vars['ENABLE_WEB_FRONTEND'] == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build]

    container:
      image: node:22-bookworm

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # Checkout a Git repository at a particular version (v6.0.2)
        with:
          persist-credentials: false

      - name: Install web dependencies
        run: npm ci

      - name: Run web ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

      - name: Upload built frontend assets
        if: matrix.check == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Upload a build artifact that can be used by… (v7.0.0)
        with:
          name: web-static-app
          path: src/feedback_triage/static/app/**
          if-no-files-found: error

  playwright-smoke:
    name: Playwright smoke (e2e)    # ci-gate: required
    needs: web-checks

    if: github.repository == 'OWNER/REPO' || vars.ENABLE_WORKFLOWS == 'true' || vars['ENABLE_WEB_FRONTEND'] == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://feedback:feedback@localhost:5432/feedback

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # Checkout a Git repository at a particular version (v6.0.2)
        with:
          persist-credentials: false

      - name: Download built frontend assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Download a build artifact that was previously… (v8.0.0)
        with:
          name: web-static-app
          path: src/feedback_triage/static/app

      - name: Verify frontend build artifact
        run: |
          set -euo pipefail
          test -f src/feedback_triage/static/app/manifest.json
          ls -la src/feedback_triage/static/app

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # Set up a specific version of Python and add… (v6.2.0)
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # Install uv with caching (v8.1.0)
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --frozen --extra e2e

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run Playwright smoke suite
        run: |
          uv run pytest -m e2e \
            tests/e2e/test_signup_flow.py \
            tests/e2e/test_react_authenticated_pages_phase2.py \
            tests/e2e/test_react_public_pages_phase3.py
