# Refreshes uv.lock on a schedule and opens a PR when the resolved graph changes.
# Uses the release GitHub App token so CI workflows run on the generated PR.

name: Refresh uv.lock

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  schedule:
    # Cron is a Unix time-scheduling syntax and the only way to
    # define scheduled triggers in GitHub Actions. It uses five
    # fields (all in UTC):
    #
    #   ┌─── minute (0–59)
    #   │ ┌─── hour (0–23)
    #   │ │ ┌─── day of month (1–31)
    #   │ │ │ ┌─── month (1–12)
    #   │ │ │ │ ┌─── day of week (0=Sun … 6=Sat)
    #   │ │ │ │ │
    #   * * * * *
    #
    # Because cron is fixed to UTC, local time shifts with DST (Daylight Saving Time):
    #   10:15 UTC = 05:15 EST (Nov–Mar) / 06:15 EDT (Mar–Nov)
    - cron: "15 10 * * 1" # Every Monday at 10:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh uv.lock

    # ── Repository guard ──────────────────────────────────────
    # Prevents this workflow from running on forks or clones
    # that haven't opted in.
    #
    #   Option A  – Edit the hardcoded slug below.
    #   Option B  – Set vars.ENABLE_UV_LOCK_REFRESH = 'true'.
    if: >-
      ${{
        github.repository == 'OWNER/REPO'
        || vars.ENABLE_WORKFLOWS == 'true'
        || vars.ENABLE_UV_LOCK_REFRESH == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # Checkout a Git repository at a particular version (v6.0.2)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # Set up a specific version of Python and add… (v6.2.0)
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # Install uv with caching (v8.1.0)
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Refresh lockfile
        run: uv lock --upgrade

      - name: Check for changes
        id: diff
        run: |
          git diff --exit-code uv.lock \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # GitHub Action for creating a GitHub App Installation Access Token (v2.2.1)
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # Creates a pull request for changes to your… (v8.1.0)
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/uv-lock-refresh
          commit-message: "build(deps): refresh uv.lock"
          title: "build(deps): refresh uv.lock"
          body: |
            Automated refresh of `uv.lock` via `uv lock --upgrade`.

            This keeps the pinned Python dependency graph current
            between Dependabot floor bumps.
          labels: |
            dependencies
            python
            uv
          delete-branch: true
