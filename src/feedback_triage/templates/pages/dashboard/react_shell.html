{% extends "_base.html" %}
{% block title %}{{ workspace_name }} React dashboard shell · SignalNest{% endblock %}

{% block head_extra %}
  {% for css_url in react_css_urls %}
    <link rel="stylesheet" href="{{ css_url }}" />
  {% endfor %}
{% endblock %}

{% block body %}
<div
  id="sn-react-app-root"
  data-workspace-slug="{{ workspace_slug }}"
  data-workspace-name="{{ workspace_name }}"
  data-dashboard-url="/w/{{ workspace_slug }}/dashboard"
  data-client-release="{{ react_client_release }}"
></div>

<noscript>
  <main id="main" class="sn-page-shell">
    <div class="sn-content-gutter">
      <section class="sn-card sn-stack">
        <h1>React dashboard shell</h1>
        <p class="sn-text-muted">JavaScript is required to load the React dashboard shell.</p>
        <p>
          <a class="sn-button sn-button-secondary" href="/w/{{ workspace_slug }}/dashboard">Back to dashboard</a>
        </p>
      </section>
    </div>
  </main>
</noscript>
<script src="{{ static_url('js/theme.js') }}" defer></script>
<script type="module" src="{{ react_script_url }}" defer></script>
{% endblock %}
